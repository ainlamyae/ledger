<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger</title>

    <style>
        :root {
            color-scheme: light dark;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: #0f172a;
            color: #f8fafc;
        }

        .container {
            max-width: 600px;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 5rem);
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.7;
            opacity: 0.85;
        }

        .badge {
            display: inline-block;
            margin-bottom: 1.5rem;
            padding: 0.4rem 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.9rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="badge">🚧 Work in Progress</div>

        <h1>Ledger</h1>

        <p>
            A lightweight personal accounting application powered by
            Google Sheets and hosted on GitHub Pages.
        </p>

        <p style="margin-top: 1rem;">
            Coming Soon.
        </p>

        <footer>
            © 2026 Ledger
        </footer>
    </main>
</body>
</html>
