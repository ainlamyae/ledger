<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">

<!-- Served for any address without a file of its own, e.g. a row's Edit
     (<wrapper>/<block>/<record>/[<view>/], router.js). The app root is the folder
     holding the section (health, finance, track or other, index.html's nav). -->
<script>
    // GYM's old address (…/activity/gym/<group>/) is now Workouts.
    if (location.pathname.includes('/activity/gym/')) {
        location.replace(location.href.replace('/activity/gym/', '/activity/workouts/'));
    }
    (function () {
        const parts = location.pathname.split('/').filter(Boolean);
        const at = parts.findIndex((p) => ['health', 'finance', 'track', 'other'].includes(p));
        const base = document.createElement('base');
        base.href = `/${parts.slice(0, Math.max(at, 0)).map((p) => `${p}/`).join('')}`;
        document.head.appendChild(base);
    }());
    if (localStorage.getItem('ledger_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
    }
    try {
        if (localStorage.getItem('ledger_side_nav') === 'closed') {
            document.documentElement.dataset.sideNav = 'closed';
        }
    } catch (e) {}
</script>

<title>Ledger</title>
<link rel="stylesheet" href="assets/style/styles.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="assets/script/motion.js"></script>
<script src="assets/script/section-page.js"></script>
</head>
